name: Share new blog posts

on:
  push:
    branches: [main]
    paths: ["src/content/blog/**"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full commit SHA before the new posts (use the same SHA when retrying)
        required: true

permissions:
  contents: read

concurrency:
  group: buffer-publishing
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Check out integration
        uses: actions/checkout@v4
        with:
          repository: HiroAgustin/astro-buffer
          ref: ab4c240328f0bee7f81c9d1030d764566d322c13
          path: .buffer-integration
          persist-credentials: false
      - name: Build integration
        working-directory: .buffer-integration
        run: npm ci && npm test && npm run build
      - name: Install integration for this run
        run: npm install --no-save --package-lock=false ./.buffer-integration
      - run: npm run social:publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_BASE_REF: ${{ github.event.before || inputs.base_ref }}

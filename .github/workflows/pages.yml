name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          mkdir _site
          cp -R -- public _site/
          for page in */index.html; do
            directory="${page%/index.html}"
            mkdir "_site/$directory"
            cp -- "$page" "_site/$page"
          done
          cp -- index.html 404.html atom.xml sitemap.xml robots.txt manifest.json Resume.pdf CNAME .nojekyll _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
